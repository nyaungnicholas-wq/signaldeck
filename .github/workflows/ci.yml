name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - run: go build ./...
      - run: go vet ./...
      # -race: H7 hostile-review finding — CI ran build/vet/test with zero
      # concurrency coverage despite a single-writer-connection design
      # (internal/store) and shared-instance workers (internal/notify) that
      # depend on it being correct. A reviewer already ran `go test -race`
      # over store, api, pipeline, and metalabel by hand and it passed clean,
      # so this is not expected to be flaky — it was simply never wired in.
      # Coverage is collected in the same invocation so this stays one test
      # run instead of two (a -race run is materially slower).
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: daemon/coverage.out

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # H7: `npm run lint` (eslint) existed but was never invoked in CI.
      - run: npm run lint
      - run: npm run build

  pre-publish-scan:
    runs-on: ubuntu-latest
    steps:
      # A13 hostile-review finding — this scan existed but was wired into
      # nobody's workflow, so a case-sensitivity bug that made it blind to
      # this project's own (UPPERCASE) env var names went unnoticed, and
      # it had never checked git history at all. fetch-depth: 0 is required
      # here — the default shallow checkout has exactly one commit, which
      # would make the history-scan step in pre-publish-scan.sh silently
      # check nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Self-test first: if the scanner itself can't prove it still detects
      # a planted secret, the real scan below is not trustworthy evidence.
      - run: ops/pre-publish-scan-test.sh
      - run: ops/pre-publish-scan.sh
