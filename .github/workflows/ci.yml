name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - run: go build ./...
      - run: go vet ./...
      # Build the COMMIT, not the checkout. checkout@v4 gives a clean tree
      # today, but the class of defect this guards is the one that actually
      # bit: a load-bearing source file present locally, absent from git, and
      # therefore absent from every clone — while builds kept passing for
      # whoever had the file. Extracting `git archive HEAD` into a scratch dir
      # and building THAT proves a fresh clone compiles and vets on its own.
      - name: Build and vet an extracted git archive HEAD (clone-only tree)
        working-directory: .
        run: |
          tmp=$(mktemp -d)
          git archive HEAD | tar -x -C "$tmp"
          cd "$tmp/daemon"
          go build ./...
          go vet ./...
      # Load-bearing paths must be tracked. See ops/manifest-check.sh for the
      # manifest and the history of why it exists.
      - name: Manifest — load-bearing paths are tracked by git
        working-directory: .
        run: bash ops/manifest-check.sh
      # A build must not mutate the tree. Two failure modes this catches, both
      # of which have bitten this repo's class of change: a generated file
      # (go.mod/go.sum tidy drift, a checked-in generated source) that was
      # edited by the build but never committed, and a build step that writes
      # an artifact into the source tree instead of a temp dir. Placed before
      # the coverage run on purpose — that step writes coverage.out, which is
      # deliberately untracked and would otherwise fail this check.
      - name: Build must leave the tree clean
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build modified or created tracked-tree paths:"
            git status --porcelain
            git diff
            exit 1
          fi
          echo "tree clean after build"
      # Lint gate beyond vet — errcheck/staticcheck/ineffassign/unused per
      # daemon/.golangci.yml. The unused/dead-code class is the mechanical
      # detector for 'existed but never wired' defects (A4 dead gate floor,
      # A13 unwired scan). working-directory is set explicitly because the
      # job's run-step default does not apply to actions.
      # FULL enforcement since 2026-07-26: the 44-issue baseline this step
      # used to grandfather via only-new-issues (really 72 — golangci's
      # default max-same-issues/max-issues-per-linter caps hid 28) was burned
      # to zero. All 5 unused findings were dead code and deleted — including
      # two never-wired api handlers (registerHonestyCache, predictionsLatest)
      # and a Poller.Cap knob Run never read, the A4/A13 class itself — plus
      # 47 errcheck discards made explicit and 20 staticcheck/ineffassign
      # cleanups. Any issue anywhere in the tree now fails the build; do not
      # reintroduce only-new-issues.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: daemon
      # -race: H7 hostile-review finding — CI ran build/vet/test with zero
      # concurrency coverage despite a single-writer-connection design
      # (internal/store) and shared-instance workers (internal/notify) that
      # depend on it being correct. A reviewer already ran `go test -race`
      # over store, api, pipeline, and metalabel by hand and it passed clean,
      # so this is not expected to be flaky — it was simply never wired in.
      # Coverage is collected in the same invocation so this stays one test
      # run instead of two (a -race run is materially slower).
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - run: go tool cover -func=coverage.out | tail -1
      # Coverage gate — the step above only *printed* the total, so coverage
      # could silently decay. The floor is the measured total minus 2pp;
      # ratchet it upward in later passes, never down.
      - name: Enforce coverage floor
        env:
          # Ratchet history: 69.2% measured 2026-07-26 → floor 67.2. Later the
          # same day a test pass lifted the total to 72.1% (store 52.8→73.4%,
          # archive 22.1→74.7%, plus alerts/confluence/evidence/lineage/alphax/
          # retention/prereg/recaudit round-trips); floor = 72.1 - 2pp.
          COVERAGE_FLOOR: "70.1"
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "total coverage: ${total}% (floor: ${COVERAGE_FLOOR}%)"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t+0 < f+0) ? 1 : 0 }' || {
            echo "::error::total coverage ${total}% fell below the ${COVERAGE_FLOOR}% floor"
            exit 1
          }
      # Per-package floors for the correctness-critical packages. The total
      # gate above can be satisfied by coverage-rich display/CRUD packages
      # while a decision gate quietly loses its tests — these floors make the
      # packages that decide what ships (store = every persisted fact and
      # grading view, forecast = purge/embargo discipline, canary = the
      # promotion gate) fail CI on their own numbers. Percentages are
      # statement-weighted, aggregated from the same coverage.out the total
      # gate reads (measured 2026-07-26: store 73.4, forecast 93.7, canary
      # 81.2; floors ≈ measured - 3pp — ratchet up with the total, never down).
      - name: Enforce per-package coverage floors (store, forecast, canary)
        run: |
          check() {
            pkg="$1"; floor="$2"
            pct=$(awk -v pkg="$pkg/" 'NR>1 {
              split($1, a, ":"); dir=a[1]; sub(/\/[^\/]*$/, "", dir); dir=dir "/";
              if (substr(dir, length(dir)-length(pkg)+1) != pkg) next;
              tot += $(NF-1); if ($NF > 0) cov += $(NF-1);
            } END { if (tot == 0) print "MISSING"; else printf "%.1f", 100*cov/tot }' coverage.out)
            if [ "$pct" = "MISSING" ]; then
              echo "::error::${pkg}: no statements found in coverage.out (package moved or profile broken)"
              exit 1
            fi
            echo "${pkg}: ${pct}% (floor: ${floor}%)"
            awk -v t="$pct" -v f="$floor" 'BEGIN { exit (t+0 < f+0) ? 1 : 0 }' || {
              echo "::error::${pkg} coverage ${pct}% fell below its ${floor}% floor"
              exit 1
            }
          }
          check internal/store 70
          check internal/forecast 90
          check internal/canary 78
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: daemon/coverage.out

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # H7: `npm run lint` (eslint) existed but was never invoked in CI.
      - run: npm run lint
      - run: npm run build

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A16 regression channel — tools/test_accuracy_registry.py holds 18
      # tests guarding the script that grades every shipped claim (including
      # test_one_market_day_cannot_validate_a_claim), but nothing ran them in
      # CI, so the day-resampling discipline could regress silently. This is
      # the discovery command the test file's own header documents.
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      # FC1 gate. Four documents once printed four different live directional
      # records — 48.1%/54.6% over 13,058, 48.0%/54.4% over 12,696, 46.7% over
      # 8,191, and 46.3%/52.9% over 2,257 — and every one of them was correct on
      # the day it was typed. Nothing distinguished the current one from the
      # stale ones, so a reader could not tell and neither could a reviewer.
      #
      # The record is now generated once (tools/live_accuracy.py reads
      # data/accuracy_registry.json into partials/live_accuracy.md) and spliced
      # into each document in partials/INCLUDES.txt between marker comments.
      # These two steps are what make that binding rather than a convention:
      # --check fails when a document's block drifts from the registry, and
      # --scan fails when any tracked markdown hand-types a live-record figure,
      # superseded OR current. A document under audits/, or one carrying the
      # SUPERSEDED-SNAPSHOT marker, is a dated record and is exempt by design.
      #
      # data/ is gitignored, so a CI runner has no registry to render — these
      # steps run only when one is present, and are the local/publish gate.
      # tools/test_live_accuracy.py (in the discovery run above) is the part
      # that DOES run on every CI job: it exercises the generator, the refusal
      # fallback, the no-verdict-while-withheld rule and the scan against
      # fixtures, so the mechanism itself cannot regress unnoticed.
      # These two run on EVERY checkout, because both of their inputs are
      # git-tracked: the committed partial, and the documents that embed it.
      # This is the half of the guard that must never be skippable — it is what
      # stops a document's copy of the table drifting from the one source, which
      # is FC1 itself. It was briefly unenforced on clean checkouts when the
      # only other check covering it was removed, hence the belt here.
      - name: Live record — every document's block matches the committed partial
        run: python3 tools/live_accuracy.py --check-includes $(cat partials/INCLUDES.txt)
      - name: Live record — no hand-typed accuracy figures in any document
        run: python3 tools/live_accuracy.py --scan $(git ls-files '*.md')
      # This one needs data/, which is gitignored, so it is the operator/publish
      # gate rather than a clean-checkout gate: it proves the PARTIAL still
      # matches the registry it was generated from.
      - name: Live record — partial still matches the registry (needs data/)
        run: |
          if [ ! -f data/accuracy_registry.json ]; then
            echo "no registry in this checkout (data/ is gitignored) — partial-vs-registry is the operator gate; doc-vs-partial ran above"
            exit 0
          fi
          python3 tools/live_accuracy.py --check --inject $(cat partials/INCLUDES.txt)
      # The snapshot is the ONLY grading path an outside reader can run, and it
      # is worthless if a file REPRODUCE.md tells them to check is missing from
      # the clone. This asserts completeness, per-file re-hash, and git-tracked
      # status without touching the (gitignored) database, so "documented but
      # not shipped" is a build failure instead of a reviewer's dead end.
      - run: python3 tools/make_repro_snapshot.py --verify-complete
      # --verify-complete asserts the snapshot is internally whole; this asserts
      # it produces the SAME published state from a cold export of HEAD as it
      # does in the working tree. The failure it exists to catch was live: a
      # clone of HEAD printed a full verdict table from a grader predating the
      # registration gate, while the operator's own tree refused to grade — a
      # stranger got more published numbers from weaker code. It compares two
      # runs of an unmodified grader, so it can only fail a build, never move a
      # number. A depth-1 checkout suffices: it only ever reads HEAD's tree.
      - name: Cold clone reproduces the working tree's published state
        run: bash ops/cold-clone-repro-check.sh
      # The manifest check also runs in the daemon job, but it now reads
      # repro/MANIFEST.json (tier 3) and every tracked markdown doc (tier 2),
      # which makes it a tools-surface guard as much as a Go one: the defect it
      # caught here was repro/grading_protocol.csv being named by MANIFEST.json
      # and by REPRODUCE.md while missing from every clone, so a stranger's
      # `tools/accuracy_registry.py --snapshot repro` graded with an
      # unregistered grader instead of aborting. Running it in this job keeps
      # that failure attached to the job that owns the grading tools.
      - name: Manifest — documented paths are shipped
        run: bash ops/manifest-check.sh

  pre-publish-scan:
    runs-on: ubuntu-latest
    steps:
      # A13 hostile-review finding — this scan existed but was wired into
      # nobody's workflow, so a case-sensitivity bug that made it blind to
      # this project's own (UPPERCASE) env var names went unnoticed, and
      # it had never checked git history at all. fetch-depth: 0 is required
      # here — the default shallow checkout has exactly one commit, which
      # would make the history-scan step in pre-publish-scan.sh silently
      # check nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Self-test first: if the scanner itself can't prove it still detects
      # a planted secret, the real scan below is not trustworthy evidence.
      - run: ops/pre-publish-scan-test.sh
      - run: ops/pre-publish-scan.sh

  ledger-provenance:
    runs-on: ubuntu-latest
    steps:
      # Every row the daemon freezes carries the revision of the build that
      # wrote it, and tools/accuracy_registry.py refuses a verdict whose rows
      # name a commit this repository cannot resolve — permanently, because its
      # window is anchored to a fixed epoch. On 2026-08-02 three clean builds
      # were rewritten out of history, 946 rows were stranded, and recovering
      # took a chained pre-registration amendment.
      #
      # ops/githooks catches that locally, but hooks are local config: a fresh
      # clone has none until someone sets core.hooksPath, and nothing stops a
      # force-push from a machine that never did. This job is the backstop for
      # what actually reaches the remote.
      #
      # It cannot ask the ledger — data/ is gitignored and the database is 4 GB
      # — so the answer is computed where the database lives and committed to
      # ops/ledger-revisions.txt. This job only verifies the commits recorded
      # there are still reachable.
      - uses: actions/checkout@v4
        with:
          # Reachability over the whole graph, so the default single-commit
          # shallow checkout would make every recorded sha look unreachable
          # and fail this job on its first run. Same reason pre-publish-scan
          # needs it.
          fetch-depth: 0
      # checkout fetches only the triggering ref. A commit legitimately living
      # on another branch would look orphaned without this, which is exactly
      # the false positive that gets a check disabled.
      - name: Fetch every branch so reachability sees all refs
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Self-test the checker before trusting it
        run: bash ops/test-ledger-provenance.sh
      - name: Ledger-referenced commits are still reachable
        run: bash ops/ledger-provenance.sh --check

  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # WHY THIS JOB EXISTS. On 2026-08-04 a P0 truth-stop froze ten strategy
      # documents. Four published mutually inconsistent live-accuracy figures,
      # three asserted survivorship control that ALPHA_WORKFLOW.md §B2 measured
      # open, and one cited a kill switch living in a DIFFERENT repository.
      # Every one of those was a number or a status a human typed into markdown,
      # with nothing in the repository able to contradict it. This job is that
      # contradicting thing.
      #
      # Self-test first: a gate that cannot prove it still detects a planted
      # violation is not evidence. Same reason pre-publish-scan-test.sh runs
      # before pre-publish-scan.sh. (These tests also run in the `tools` job's
      # unittest discovery; running them HERE keeps the failure attached to the
      # job that owns the gate, so a red X names the right thing.)
      - name: Self-test the gate before trusting it
        run: python3 tools/test_docs_gate.py
      # data/ is gitignored and signaldeck.db is ~4 GB, so this runner can never
      # ask the database whether the PIT universe is populated or the grader is
      # refusing. Identical split to ops/ledger-provenance.sh: the answer is
      # computed where the database lives (`docs_gate.py write-integrity`) and
      # committed to ops/data-integrity.json; this step only verifies it.
      #
      # A MISSING OR STALE SNAPSHOT IS A VIOLATION, NEVER A SKIP. That is the
      # whole reason the split is safe — it cannot degrade into silence, which
      # is how "we'll check it locally" becomes "nobody checks it".
      - name: Documents may not contradict the repository's own measurements
        run: python3 tools/docs_gate.py check
      # STRATEGY_DECK.md §8 carried this defect in one sentence: the structural
      # walk-forward validation "runs on demand only. Nothing schedules it and no
      # gate consumes its output." A validation nobody reads is indistinguishable
      # from one that was never run, which is the same shape as the dead A4 gate
      # floor and the unwired A13 scan.
      #
      # ops/com.signaldeck.revalidation.plist is now the schedule (monthly) and
      # ops/revalidate-structural.sh writes ops/revalidation-status.json. Same
      # split as ops/data-integrity.json: the ~4 GB database is gitignored so a
      # runner cannot re-derive the answer, it verifies the committed one. A
      # MISSING OR STALE SNAPSHOT IS A VIOLATION, NEVER A SKIP.
      - name: The structural revalidation has been run, and recently
        run: python3 tools/check_revalidation.py
      # DOCS_INDEX.md is RENDERED from ops/docs-registry.json, so it is the one
      # place a reader sees each document's owner / version / data-as-of /
      # status. A rendered file that stops matching its source is worse than no
      # file: it displays a status the registry no longer holds, with a
      # generated-by header vouching for it. The generator can already detect
      # that (`--check`); nothing ran it, which is the "existed but never wired"
      # class this repo has been bitten by twice (A4, A13).
      - name: The rendered document index still matches the registry
        run: python3 tools/gen_docs_index.py --check
