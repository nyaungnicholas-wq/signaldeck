# SignalDeck demo deployment (Fly.io).
#
# Why Fly and not Vercel: the daemon is a long-running Go process that owns a
# SQLite file and runs a worker fleet on a schedule. Vercel's functions are
# request-scoped and have no persistent disk, so the half of SignalDeck that
# does the actual work cannot live there. Any host that gives you a persistent
# volume and a process that stays up will do — Railway, Render, a $5 VPS.
#
# Deploy:
#   fly launch --no-deploy --name <your-app-name>   # once, to create the app
#   fly volumes create signaldeck_data --size 10 --region <region>
#   fly secrets set ALPACA_KEY=... ALPACA_SECRET=...
#   fly deploy --build-arg GIT_REV=$(git rev-parse HEAD)
#
# GIT_REV is not optional. The daemon refuses to start from a build it cannot
# attribute to a commit, because rows it writes could not then be graded.

app = "signaldeck-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SIGNALDECK_DB = "/data/signaldeck.db"
  SIGNALDECK_HTTP = "127.0.0.1:8322"
  SIGNALDECK_DAEMON = "http://127.0.0.1:8322"
  PORT = "8080"

  # ANONYMOUS SURFACE - an ALLOWLIST, not a denylist.
  # This replaces a bare SIGNALDECK_PUBLIC_READS = "1", which is DENYLIST mode:
  # it opens every read route except the ones someone remembered to name, so a
  # route added later is public by forgetting (config.go:132-140 names exactly
  # that outcome). PUBLIC_SURFACE instead makes api.publicRoutes the ENTIRE
  # anonymous surface - the honesty routes and nothing else. This is what
  # docs/PUBLIC_RELEASE_PLAN.md specifies and what ledger F20 verified on
  # 2026-09-08: anonymous honesty routes; 401 on every workspace, vendor-data
  # and AI route; 403 on registration and on a foreign Host header.
  SIGNALDECK_PUBLIC_SURFACE = "1"

  # Stated, not derived. The default follows reachablePrivately(), which reads
  # the DAEMON bind address - loopback here by design - and so evaluated
  # "private" on the one deployment that is public, defaulting registration
  # OPEN to the internet. ops/docker-entrypoint.sh now corrects that
  # derivation; this states the intent outright so it does not depend on it.
  SIGNALDECK_OPEN_SIGNUP = "0"

  # REQUIRED before a real public deploy, and it is not just the hostname:
  # web/src/app/api/[...path]/route.ts does NOT forward the Host header, so the
  # daemon always sees 127.0.0.1:8322 from the proxy. An allowlist naming ONLY
  # the public hostname 403s every request. Set BOTH.
  # (docs/PUBLIC_RELEASE_PLAN.md step 3 omits the loopback pair.)
  # SIGNALDECK_ALLOWED_HOSTS = "<your-app>.fly.dev,127.0.0.1:8322,localhost:8322"

[[mounts]]
  source = "signaldeck_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false     # see note below
  auto_start_machines = true
  min_machines_running = 1

  # DO NOT enable auto_stop. The worker fleet is the product: it ingests bars,
  # scores symbols, and freezes pre-registered forecasts on a schedule. A
  # machine that sleeps between visitors silently stops recording, and the
  # honesty page would then grade gaps it caused itself.

[[http_service.checks]]
  grace_period = "120s"          # cold volume: schema creation + first backfill
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"                 # SQLite page cache over a multi-GB database
